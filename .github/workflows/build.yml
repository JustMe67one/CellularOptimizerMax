name: Build Custom Network App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Package IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install Project Generator
        run: brew install xcodegen

      - name: Generate Core Manifests & Structure
        run: |
          mkdir -p CellularOptimizerMax/Sources
          
          # إنشاء ملف Info.plist الضروري للشبكات
          cat << 'EOF' > CellularOptimizerMax/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>CellularOptimizerMax</string>
            <key>CFBundleIdentifier</key>
            <string>com.custom.cellularoptimizer</string>
            <key>CFBundleName</key>
            <string>CellularOptimizerMax</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UILaunchScreen</key>
            <dict/>
          </dict>
          </plist>
          EOF

          # إنشاء هيكل مشروع XcodeGen المكتمل
          cat << 'EOF' > project.yml
          name: CellularOptimizerMax
          options:
            bundleIdPrefix: com.custom
            deploymentTarget:
              iOS: "16.0"
          targets:
            CellularOptimizerMax:
              type: application
              platform: iOS
              sources:
                - CellularOptimizerMax
              settings:
                base:
                  INFOPLIST_FILE: CellularOptimizerMax/Info.plist
                  PRODUCT_BUNDLE_IDENTIFIER: com.custom.cellularoptimizer
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGN_IDENTITY: ""
          EOF

          # توليد ملف Xcode الرسمي
          xcodegen generate

      - name: Compile and Archive Project
        run: |
          xcodebuild -project CellularOptimizerMax.xcodeproj \
            -scheme CellularOptimizerMax \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/CellularOptimizerMax.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Extract App and Create IPA
        run: |
          mkdir -p Payload
          cp -R build/CellularOptimizerMax.xcarchive/Products/Applications/CellularOptimizerMax.app Payload/
          zip -r CellularOptimizerMax.ipa Payload

      - name: Publish IPA File
        uses: actions/upload-artifact@v4
        with:
          name: CellularOptimizerMax-IPA
          path: CellularOptimizerMax.ipa
