name: Build iOS App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create project.yml
        run: |
          cat << 'EOF' > project.yml
          name: CellularOptimizerMax
          options:
            bundleIdPrefix: com.optimizer
          targets:
            CellularOptimizerMax:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: CellularOptimizerMax/Sources
              settings:
                INFOPLIST_PLIST_DICT:
                  UILaunchScreen: {}
                  CFBundleIdentifier: "com.optimizer.CellularOptimizerMax"
                  CFBundleShortVersionString: "1.0"
                  CFBundleVersion: "1"
          schemes:
            CellularOptimizerMax:
              build:
                targets:
                  CellularOptimizerMax: all
          EOF

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build and Archive
        run: |
          set -o pipefail
          xcodebuild -project CellularOptimizerMax.xcodeproj -scheme CellularOptimizerMax -sdk iphoneos -configuration Release archive -archivePath build/CellularOptimizerMax.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcode_build.log || {
            echo "=== BUILD FAILED, SHOWING LOG TAIL ==="
            tail -n 100 xcode_build.log
            exit 1
          }
          
      - name: Export IPA
        run: |
          mkdir -p Payload
          cp -r build/CellularOptimizerMax.xcarchive/Products/Applications/*.app Payload/
          zip -r CellularOptimizerMax.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CellularOptimizerMax-IPA
          path: CellularOptimizerMax.ipa
