name: Build Custom Network App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Package IPA
    runs-on: macos-13
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install Project Generator
        run: brew install xcodegen

      - name: Gather and Organize Swift Files
        run: |
          mkdir -p AppProject/Sources
          find . -name "*.swift" -not -path "*/.*" -exec cp {} AppProject/Sources/ \;
          echo "=== ملفات السويفت المكتشفة ==="
          ls -la AppProject/Sources

          cat << 'EOF' > AppProject/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>CellularOptimizerMax</string>
            <key>CFBundleIdentifier</key>
            <string>com.custom.cellularoptimizer</string>
            <key>CFBundleName</key>
            <string>CellularOptimizerMax</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UILaunchScreen</key>
            <dict/>
          </dict>
          </plist>
          EOF

          cat << 'EOF' > AppProject/project.yml
          name: CellularOptimizerMax
          options:
            bundleIdPrefix: com.custom
            deploymentTarget:
              iOS: "16.0"
          targets:
            CellularOptimizerMax:
              type: application
              platform: iOS
              sources:
                - Sources
              settings:
                base:
                  INFOPLIST_FILE: Info.plist
                  PRODUCT_BUNDLE_IDENTIFIER: com.custom.cellularoptimizer
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGN_IDENTITY: ""
          EOF

      - name: Precise Patching Script
        run: |
          python3 -c '
          import glob, re
          for path in glob.glob("**/DNSController.swift", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              content = re.sub(r"(NEDNSOverHTTPSSettings\s*\([^\)]*\))\s*!", r"\1", content)
              content = re.sub(r",\s*serverURL\s*:[^,\)]+", "", content)
              content = re.sub(r"serverURL\s*:[^,\)]+\s*,?", "", content)
              lines = content.splitlines()
              new_lines = []
              for l in lines:
                  if "isEnabled" in l and "=" in l and not l.strip().startswith("//"):
                      new_lines.append("// " + l + " // Neutralized\n")
                  else:
                      new_lines.append(l)
              with open(path, "w", encoding="utf-8") as f:
                  f.writelines(new_lines)

          for path in glob.glob("**/ProbeEngine.swift", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              content = content.replace(".values.last", ".values.map({$0}).last")
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          '

      - name: Generate Project and Compile
        run: |
          cd AppProject
          xcodegen generate
          xcodebuild -project CellularOptimizerMax.xcodeproj \
            -scheme CellularOptimizerMax \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/CellularOptimizerMax.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package to IPA
        run: |
          cd AppProject
          mkdir -p Payload
          cp -R build/CellularOptimizerMax.xcarchive/Products/Applications/CellularOptimizerMax.app Payload/
          zip -r CellularOptimizerMax.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CellularOptimizerMax-IPA
          path: AppProject/CellularOptimizerMax.ip
