name: Build Custom Network App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Package IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install Project Generator
        run: brew install xcodegen

      - name: Gather and Organize Swift Files
        run: |
          mkdir -p AppProject/Sources
          find . -name "*.swift" -not -path "*/.*" -exec cp {} AppProject/Sources/ \;

          cat << 'EOF' > AppProject/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>CellularOptimizerMax</string>
            <key>CFBundleIdentifier</key>
            <string>com.custom.cellularoptimizer</string>
            <key>CFBundleName</key>
            <string>CellularOptimizerMax</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UILaunchScreen</key>
            <dict/>
          </dict>
          </plist>
          EOF

          cat << 'EOF' > AppProject/project.yml
          name: CellularOptimizerMax
          options:
            bundleIdPrefix: com.custom
            deploymentTarget:
              iOS: "16.0"
          targets:
            CellularOptimizerMax:
              type: application
              platform: iOS
              sources:
                - Sources
              settings:
                base:
                  INFOPLIST_FILE: Info.plist
                  PRODUCT_BUNDLE_IDENTIFIER: com.custom.cellularoptimizer
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGN_IDENTITY: ""
          EOF

      - name: Overwrite & Sanitize DNSController & ProbeEngine
        run: |
          python3 << 'EOF'
          import glob, re

          dns_code = """import Foundation
          import NetworkExtension

          @MainActor
          final class DNSController: ObservableObject {
              @Published private(set) var active = false
              @Published private(set) var message = "Managed DNS is off"
              private let manager = NEDNSSettingsManager.shared()

              func load() async {
                  await withCheckedContinuation { continuation in
                      manager.loadFromPreferences { [weak self] error in
                          Task { @MainActor in
                              if let error {
                                  self?.message = error.localizedDescription
                              } else {
                                  self?.active = self?.manager.isEnabled ?? false
                              }
                              continuation.resume()
                          }
                      }
                  }
              }

              func setCloudflare(_ enabled: Bool) async {
                  await withCheckedContinuation { continuation in
                      manager.loadFromPreferences { [weak self] error in
                          guard let self else { continuation.resume(); return }
                          if let error {
                              Task { @MainActor in
                                  self.message = error.localizedDescription
                                  continuation.resume()
                              }
                              return
                          }
                          if enabled {
                              let settings = NEDNSOverHTTPSSettings(servers: ["1.1.1.1", "1.0.0.1"])
                              settings.matchDomains = [""]
                              self.manager.localizedDescription = "Cellular Optimizer MAX"
                              self.manager.dnsSettings = settings
                          } else {
                              self.manager.dnsSettings = nil
                          }
                          self.manager.saveToPreferences { error in
                              Task { @MainActor in
                                  if let error {
                                      self.message = error.localizedDescription
                                  } else {
                                      self.active = enabled
                                      self.message = enabled ? "Encrypted DNS active" : "Managed DNS is off"
                                  }
                                  continuation.resume()
                              }
                          }
                      }
                  }
              }
          }
          """

          for path in glob.glob("**/DNSController.swift", recursive=True):
              with open(path, "w", encoding="utf-8") as f:
                  f.write(dns_code)

          for path in glob.glob("**/ProbeEngine.swift", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              content = content.replace(".values.last", ".values.map({$0}).last")
              content = re.sub(r'(\b[a-zA-Z0-9_]+\s*=\s*)(t\.domainResolutionProtocol\.rawValue)', r'\1String(\2)', content)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          EOF

      - name: Generate Project and Compile
        run: |
          cd AppProject
          xcodegen generate
          
          set -o pipefail
          xcodebuild -project CellularOptimizerMax.xcodeproj \
            -scheme CellularOptimizerMax \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/CellularOptimizerMax.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO > build_log.txt 2>&1 || {
              echo "=== تفاصيل الخطأ الحقيقي بدقة ==="
              grep -C 3 -i "error:" build_log.txt || tail -n 80 build_log.txt
              exit 65
            }

      - name: Package to IPA
        run: |
          cd AppProject
          mkdir -p Payload
          cp -R build/CellularOptimizerMax.xcarchive/Products/Applications/CellularOptimizerMax.app Payload/
          zip -r CellularOptimizerMax.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CellularOptimizerMax-IPA
          path: AppProject/CellularOptimizerMax.ipa
