name: Build Custom Network App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Package IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install Project Generator
        run: brew install xcodegen

      - name: Gather and Organize Swift Files
        run: |
          mkdir -p AppProject/Sources
          find . -name "*.swift" -not -path "*/.*" -exec cp {} AppProject/Sources/ \;
          echo "=== ملفات السويفت المكتشفة ==="
          ls -la AppProject/Sources

          cat << 'EOF' > AppProject/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>CellularOptimizerMax</string>
            <key>CFBundleIdentifier</key>
            <string>com.custom.cellularoptimizer</string>
            <key>CFBundleName</key>
            <string>CellularOptimizerMax</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UILaunchScreen</key>
            <dict/>
          </dict>
          </plist>
          EOF

          cat << 'EOF' > AppProject/project.yml
          name: CellularOptimizerMax
          options:
            bundleIdPrefix: com.custom
            deploymentTarget:
              iOS: "16.0"
          targets:
            CellularOptimizerMax:
              type: application
              platform: iOS
              sources:
                - Sources
              settings:
                base:
                  INFOPLIST_FILE: Info.plist
                  PRODUCT_BUNDLE_IDENTIFIER: com.custom.cellularoptimizer
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGN_IDENTITY: ""
          EOF

      - name: Advanced Precision Auto-Fix Script
        run: |
          python3 -c '
          import re

          # 1. إصلاح ProbeEngine.swift (السطر 51: تحويل القيمة المسندة إلى String بأمان)
          probe_path = "AppProject/Sources/ProbeEngine.swift"
          with open(probe_path, "r", encoding="utf-8") as f:
              lines = f.readlines()
          if len(lines) >= 51:
              line = lines[50]
              if "=" in line and "String(" not in line:
                  parts = line.split("=", 1)
                  lhs = parts[0]
                  rhs = parts[1].strip()
                  semi = ";" if rhs.endswith(";") else ""
                  rhs = rhs.rstrip(";")
                  lines[50] = f"{lhs} = String({rhs}){semi}\n"
          with open(probe_path, "w", encoding="utf-8") as f:
              f.writelines(lines)
          print("تم إصلاح ProbeEngine.swift بنجاح")

          # 2. إصلاح DNSController.swift (تنظيف الفواصل وعلامات التعجب الزائدة حول NEDNSOverHTTPSSettings)
          dns_path = "AppProject/Sources/DNSController.swift"
          with open(dns_path, "r", encoding="utf-8") as f:
              content = f.read()
          # إزالة الـ ! بعد تهيئة NEDNSOverHTTPSSettings
          content = re.sub(r"NEDNSOverHTTPSSettings\s*\((.*?)\)\s*!", r"NEDNSOverHTTPSSettings(\1)", content, flags=re.DOTALL)
          # إزالة الوسيط الزائد serverURL وأي فواصل معلقة ناتجة عنه
          content = re.sub(r",?\s*serverURL\s*:\s*[^,\)]+", "", content)
          content = re.sub(r"\(\s*,", "(", content)
          content = re.sub(r",\s*\)", ")", content)
          with open(dns_path, "w", encoding="utf-8") as f:
              f.write(content)
          print("تم إصلاح DNSController.swift بنجاح")
          '

      - name: Generate Project and Compile
        run: |
          cd AppProject
          xcodegen generate
          
          set -o pipefail
          xcodebuild -project CellularOptimizerMax.xcodeproj \
            -scheme CellularOptimizerMax \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/CellularOptimizerMax.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO > build_log.txt 2>&1 || {
              echo "=== تفاصيل خطأ المترجم الجديد ==="
              grep -i "error:" build_log.txt || tail -n 50 build_log.txt
              exit 74
            }

      - name: Package to IPA
        run: |
          cd AppProject
          mkdir -p Payload
          cp -R build/CellularOptimizerMax.xcarchive/Products/Applications/CellularOptimizerMax.app Payload/
          zip -r CellularOptimizerMax.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CellularOptimizerMax-IPA
          path: AppProject/CellularOptimizerMax.ipa
