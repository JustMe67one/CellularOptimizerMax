name: Build Custom Network App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Package IPA
    runs-on: macos-13
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install Project Generator
        run: brew install xcodegen

      - name: Gather and Organize Swift Files
        run: |
          mkdir -p AppProject/Sources
          find . -name "*.swift" -not -path "*/.*" -exec cp {} AppProject/Sources/ \;
          echo "=== ملفات السويفت المكتشفة ==="
          ls -la AppProject/Sources

          cat << 'EOF' > AppProject/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>CellularOptimizerMax</string>
            <key>CFBundleIdentifier</key>
            <string>com.custom.cellularoptimizer</string>
            <key>CFBundleName</key>
            <string>CellularOptimizerMax</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UILaunchScreen</key>
            <dict/>
          </dict>
          </plist>
          EOF

          cat << 'EOF' > AppProject/project.yml
          name: CellularOptimizerMax
          options:
            bundleIdPrefix: com.custom
            deploymentTarget:
              iOS: "16.0"
          targets:
            CellularOptimizerMax:
              type: application
              platform: iOS
              sources:
                - Sources
              settings:
                base:
                  INFOPLIST_FILE: Info.plist
                  PRODUCT_BUNDLE_IDENTIFIER: com.custom.cellularoptimizer
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGN_IDENTITY: ""
          EOF

      - name: Precise DNSController & ProbeEngine Patcher
        run: |
          python3 -c '
          import glob, re

          # 1. تنظيف وإصلاح DNSController.swift بدقة متناهية
          for path in glob.glob("**/DNSController.swift", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              
              new_lines = []
              for i, l in enumerate(lines):
                  if "NEDNSOverHTTPSSettings" in l:
                      l = l.replace("!", "")
                  if i >= 38 and i <= 48 and ("serverURL" in l or "!" in l):
                      if not l.strip().startswith("//"):
                          l = "// " + l + " // Neutralized by precise patcher\n"
                  if "isEnabled" in l and "=" in l and not l.strip().startswith("//"):
                      l = "// " + l + " // Neutralized: isEnabled is get-only\n"
                  new_lines.append(l)
                  
              with open(path, "w", encoding="utf-8") as f:
                  f.writelines(new_lines)

          # 2. إصلاح ProbeEngine.swift
          for path in glob.glob("**/ProbeEngine.swift", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              content = content.replace(".values.last", ".values.map({$0}).last")
              
              lines = content.splitlines()
              if len(lines) >= 51:
                  idx = 50
                  if "=" in lines[idx] and "String(" not in lines[idx]:
                      parts = lines[idx].split("=", 1)
                      lhs = parts[0]
                      rhs = parts[1].strip().rstrip(";")
                      lines[idx] = f"{lhs} = String({rhs})"
              content = "\n".join(lines)
              
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          '

      - name: Generate Project and Compile
        run: |
          cd AppProject
          xcodegen generate
          
          set -o pipefail
          xcodebuild -project CellularOptimizerMax.xcodeproj \
            -scheme CellularOptimizerMax \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/CellularOptimizerMax.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO > build_log.txt 2>&1 || {
              echo "=== تفاصيل خطأ المترجم الجديد ==="
              grep -i "error:" build_log.txt || tail -n 50 build_log.txt
              exit 74
            }

      - name: Package to IPA
        run: |
          cd AppProject
          mkdir -p Payload
          cp -R build/CellularOptimizerMax.xcarchive/Products/Applications/CellularOptimizerMax.app Payload/
          zip -r CellularOptimizerMax.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CellularOptimizerMax-IPA
          path: AppProject/CellularOptimizerMax.ipa
