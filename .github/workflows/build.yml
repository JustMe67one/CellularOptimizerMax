name: Build Custom Network App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Package IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install Project Generator
        run: brew install xcodegen

      - name: Gather and Organize Swift Files
        run: |
          mkdir -p AppProject/Sources
          find . -name "*.swift" -not -path "*/.*" -exec cp {} AppProject/Sources/ \;
          echo "=== ملفات السويفت المكتشفة ==="
          ls -la AppProject/Sources

          cat << 'EOF' > AppProject/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>CellularOptimizerMax</string>
            <key>CFBundleIdentifier</key>
            <string>com.custom.cellularoptimizer</string>
            <key>CFBundleName</key>
            <string>CellularOptimizerMax</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UILaunchScreen</key>
            <dict/>
          </dict>
          </plist>
          EOF

          cat << 'EOF' > AppProject/project.yml
          name: CellularOptimizerMax
          options:
            bundleIdPrefix: com.custom
            deploymentTarget:
              iOS: "16.0"
          targets:
            CellularOptimizerMax:
              type: application
              platform: iOS
              sources:
                - Sources
              settings:
                base:
                  INFOPLIST_FILE: Info.plist
                  PRODUCT_BUNDLE_IDENTIFIER: com.custom.cellularoptimizer
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGN_IDENTITY: ""
          EOF

      - name: Bulletproof String-Based Patching Script
        run: |
          python3 -c '
          # 1. إصلاح ProbeEngine.swift بطريقة نصية بحتة
          probe_path = "AppProject/Sources/ProbeEngine.swift"
          with open(probe_path, "r", encoding="utf-8") as f:
              content = f.read()
          content = content.replace(".values.last", ".values.map({$0}).last")
          with open(probe_path, "w", encoding="utf-8") as f:
              f.write(content)
          print("ProbeEngine fixed via string replacement.")

          # 2. إصلاح DNSController.swift بتعليق أي سطر يحتوي على serverURL تلقائياً
          dns_path = "AppProject/Sources/DNSController.swift"
          with open(dns_path, "r", encoding="utf-8") as f:
              lines = f.readlines()
          
          new_dns_lines = []
          for l in lines:
              if "serverURL" in l and not l.strip().startswith("//"):
                  l = "// " + l + " // Commented out by patcher\n"
              new_dns_lines.append(l)
              
          with open(dns_path, "w", encoding="utf-8") as f:
              f.writelines(new_dns_lines)
          print("DNSController fixed via line filtering.")
          '

      - name: Generate Project and Compile
        run: |
          cd AppProject
          xcodegen generate
          
          set -o pipefail
          xcodebuild -project CellularOptimizerMax.xcodeproj \
            -scheme CellularOptimizerMax \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/CellularOptimizerMax.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO > build_log.txt 2>&1 || {
              echo "=== تفاصيل خطأ المترجم الجديد ==="
              grep -i "error:" build_log.txt || tail -n 50 build_log.txt
              exit 74
            }

      - name: Package to IPA
        run: |
          cd AppProject
          mkdir -p Payload
          cp -R build/CellularOptimizerMax.xcarchive/Products/Applications/CellularOptimizerMax.app Payload/
          zip -r CellularOptimizerMax.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CellularOptimizerMax-IPA
          path: AppProject/CellularOptimizerMax.ipa
