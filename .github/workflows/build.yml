name: Build iOS App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create project.yml
        run: |
          cat << 'EOF' > CellularOptimizerMax/project.yml
          name: CellularOptimizerMax
          options:
            bundleIdPrefix: com.optimizer
          targets:
            CellularOptimizerMax:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - Sources
              frameworks:
                - NetworkExtension.framework
                - Network.framework
              settings:
                CODE_SIGN_STYLE: Manual
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_REQUIRED: "NO"
                CODE_SIGNING_ALLOWED: "NO"
                INFOPLIST_PLIST_DICT:
                  UILaunchScreen: {}
                  CFBundleIdentifier: "com.optimizer.CellularOptimizerMax"
                  CFBundleShortVersionString: "1.0"
                  CFBundleVersion: "1"
          schemes:
            CellularOptimizerMax:
              build:
                targets:
                  CellularOptimizerMax: all
          EOF

      - name: Generate Project and Build
        run: |
          cd CellularOptimizerMax
          xcodegen generate
          xcodebuild -project CellularOptimizerMax.xcodeproj -scheme CellularOptimizerMax -sdk iphoneos -configuration Release build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          cd CellularOptimizerMax
          mkdir -p Payload
          find . -name "*.app" -maxdepth 4 -exec cp -r {} Payload/ \;
          zip -r CellularOptimizerMax.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CellularOptimizerMax-IPA
          path: CellularOptimizerMax/CellularOptimizerMax.ipa
